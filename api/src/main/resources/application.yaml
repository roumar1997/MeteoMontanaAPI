spring:
  application:
    name: api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    # En prod (Railway/Render/Fly) inyectan DATABASE_URL como JDBC URL completa.
    # En dev, del .env de la raíz con las vars individuales.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meteomontana}
    username: ${DATABASE_USERNAME:${PGUSER:meteomontana}}
    password: ${POSTGRES_PASSWORD:${PGPASSWORD:}}
    hikari:
      # Pool de conexiones. Subir vía env DB_POOL_SIZE en Railway (p.ej. 15),
      # SIN pasar de (réplicas × pool) ≤ ~70% del max_connections de Postgres.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  error:
    # Mostrar el message de ResponseStatusException en el JSON de error
    # (la app lo enseña al usuario; sin esto solo llega "Service Unavailable").
    include-message: always

# Cache Caffeine — TTL 90 min para no martillear Open-Meteo (191 escuelas
# por barrido de scores; con 30m rozábamos el límite gratuito de 10k/día
# y Open-Meteo empezó a cortar conexiones desde la IP de Railway).
spring.cache:
  type: caffeine
  cache-names: forecast, today-scores, range-scores, schools-catalog, geocode
  caffeine:
    spec: maximumSize=500,expireAfterWrite=90m

# Healthcheck endpoint para que Railway/Render sepan si la app está viva.
management:
  endpoints:
    web:
      exposure:
        # metrics: para ver latencia, errores y uso del pool Hikari
        # (hikaricp.connections.active) en /actuator/metrics/{nombre}.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
