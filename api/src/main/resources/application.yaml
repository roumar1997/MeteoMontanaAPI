spring:
  application:
    name: api
  config:
    import: optional:file:../.env[.properties]
  datasource:
    # En prod (Railway/Render/Fly) inyectan DATABASE_URL como JDBC URL completa.
    # En dev, del .env de la raíz con las vars individuales.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meteomontana}
    username: ${DATABASE_USERNAME:${PGUSER:meteomontana}}
    password: ${POSTGRES_PASSWORD:${PGPASSWORD:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8080}
  error:
    # Mostrar el message de ResponseStatusException en el JSON de error
    # (la app lo enseña al usuario; sin esto solo llega "Service Unavailable").
    include-message: always

# Cache Caffeine — TTL 30 min para no martillear Open-Meteo
spring.cache:
  type: caffeine
  cache-names: forecast, today-scores
  caffeine:
    spec: maximumSize=500,expireAfterWrite=30m

# Healthcheck endpoint para que Railway/Render sepan si la app está viva.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
