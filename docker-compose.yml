services:
  postgres:
    image: postgres:16-alpine
    container_name: meteomontana-postgres
    environment:
      POSTGRES_DB: meteomontana
      POSTGRES_USER: meteomontana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data: